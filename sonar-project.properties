# SonarQube Cloud. projectKey and organization must match what Sonar creates
# when the project is imported; adjust them there rather than guessing here.
sonar.projectKey=napalm255_quickrem
sonar.organization=napalm255

sonar.sources=modules,extension.js,prefs.js
sonar.tests=tests
sonar.exclusions=node_modules/**,coverage/**,docs/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info

# modules/panel.js and extension.js are St/QuickSettings widget construction and
# lifecycle wiring. Asserting those against stubs of the toolkit tests the
# stubs, so they are covered by scripts/headless-check.sh instead, which enables,
# disables and re-enables the real extension in a real gnome-shell. Kept
# identical to what vitest.config.js measures, so the two agree.
sonar.coverage.exclusions=modules/panel.js,extension.js
